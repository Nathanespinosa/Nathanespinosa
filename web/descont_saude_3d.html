<style>
/* Layout: 3D em tela cheia; HUD flutuante em vidro escuro (mesmo visual nos dois temas, cena 3D é a protagonista) */
:root {
  --hud-bg: rgba(10, 30, 60, 0.72);
  --hud-fg: #F2F6FA;
  --hud-muted: #A9BCD0;
  --azul: #0B3F86;
  --lima: #8CC63F;
  --ciano: #22A8E6;
  --font: "Lexend", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; background: #DDE4EA; color: var(--hud-fg); font-family: var(--font); }
#app { position: fixed; inset: 0; }
canvas#cena { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
.hud { position: absolute; background: var(--hud-bg); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-radius: 12px; }
#topo {
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  left: max(12px, env(safe-area-inset-left, 0px));
  right: max(12px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 12px; padding: 8px 12px; flex-wrap: wrap;
}
#topo h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 0.01em; }
#topo h1 b { color: var(--lima); font-weight: 700; }
#zona { font-size: 13px; color: var(--hud-muted); flex: 1; min-width: 0; text-wrap: balance; }
#zona strong { color: var(--hud-fg); font-weight: 600; }
.chk { display: flex; gap: 6px; }
button {
  font: 600 12px/1 var(--font); color: var(--hud-fg); background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.22); border-radius: 999px; padding: 8px 12px; cursor: pointer; white-space: nowrap;
}
button:hover { background: rgba(255,255,255,0.22); }
button:focus-visible { outline: 2px solid var(--lima); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--lima); color: #12301A; border-color: var(--lima); }
#vistas {
  bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
  left: max(12px, env(safe-area-inset-left, 0px));
  right: max(12px, env(safe-area-inset-right, 0px));
  padding: 8px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
}
#vistas::-webkit-scrollbar { display: none; }
#ajuda {
  top: calc(env(safe-area-inset-top, 0px) + 66px);

}
#ajuda kbd { font-family: var(--font); color: var(--hud-fg); background: rgba(255,255,255,0.14); border-radius: 4px; padding: 0 5px; }
#ajuda .t { display: none; }
body.toque #ajuda .t { display: block; }
body.toque #ajuda .d { display: none; }
#joy { position: absolute; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.6); background: rgba(11,63,134,0.25); pointer-events: none; }
#joy i { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px;
  border-radius: 50%; background: rgba(140,198,63,0.9); }
[hidden] { display: none !important; }
#carregando { position: absolute; inset: 0; display: grid; place-items: center; color: var(--azul); font: 600 16px var(--font); }
@media (max-width: 520px) {
  #topo h1 { font-size: 14px; flex: 1; }
  #zona { order: 3; flex-basis: 100%; font-size: 12px; }
  #ajuda { max-width: 240px; top: calc(env(safe-area-inset-top, 0px) + 92px); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
"use strict";
// ======================================================================
// Coordenadas = as mesmas do script do Blender (metros):
//   X = largura (0 = parede esquerda), Y = profundidade (0 = vitrine), Z = altura.
// Conversão para o Three.js (Y para cima): (x, y, z) -> (x, z, -y)
// ======================================================================
const PE = 3.80, LAJE = 3.96, LARG = 7.85, PROF = 8.00, EI = 0.10, EE = 0.20;
const SX0 = 1.30, SX1 = 6.35, SY0 = 8.00, SY1 = 12.00, DX0 = 3.74, DX1 = 3.85;
const EY0 = 1.65, EL = 1.20, ESP = 0.18, PD = 0.28, N1 = 11, N2 = 10;
const PY0 = EY0 + N1 * PD, PY1 = PY0 + EL, PZ = (N1 + 1) * ESP, L2X0 = EL, L2X1 = L2X0 + N2 * PD;
const LX0 = 6.25, LY0 = 5.00, LY1 = 7.10, BARRADO = 1.10;

const V = (x, y, z) => new THREE.Vector3(x, z, -y);
const cena = new THREE.Scene();
cena.background = new THREE.Color(0xC9D6E2);
cena.fog = new THREE.Fog(0xC9D6E2, 25, 60);
const solidos = [];       // AABBs 2D [x0, y0, x1, y1] para colisão
const forro = new THREE.Group(); cena.add(forro);

// ---------------- Texturas procedurais (canvas) ----------------
function tex(w, h, desenho, rx = 1, ry = 1) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  desenho(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.anisotropy = 4;
  return t;
}
const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
const texPiso = tex(512, 256, (g, w, h) => {      // 2.44 x 0.74 m: réguas 1.22 x 0.185
  for (let r = 0; r < 4; r++) {
    const off = (r % 2) * 0.5;
    for (let k = -1; k < 3; k++) {
      const x0 = (k + off) * w / 2, v = 196 + Math.floor(rnd() * 14);
      g.fillStyle = `rgb(${v},${v + 3},${v + 5})`; g.fillRect(x0, r * h / 4, w / 2, h / 4);
      for (let i = 0; i < 30; i++) { g.fillStyle = `rgba(150,155,160,${rnd() * 0.08})`; g.fillRect(x0 + rnd() * w / 2, r * h / 4 + rnd() * h / 4, 40 + rnd() * 80, 1); }
      g.fillStyle = "#9EA3A7"; g.fillRect(x0, r * h / 4, 2, h / 4);
    }
    g.fillStyle = "#9EA3A7"; g.fillRect(0, r * h / 4, w, 2);
  }
}, (LARG + 2 * EE) / 2.44, (SY1 + 0.35) / 0.74);
const texMarmore = tex(512, 512, (g, w, h) => {
  g.fillStyle = "#F4F4F1"; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 14; i++) {
    g.strokeStyle = `rgba(110,118,125,${0.25 + rnd() * 0.5})`; g.lineWidth = 0.6 + rnd() * 2.2;
    g.beginPath(); let x = rnd() * w, y = 0; g.moveTo(x, y);
    while (y < h) { x += (rnd() - 0.5) * 70; y += 20 + rnd() * 40; g.lineTo(x, y); }
    g.stroke();
  }
});
const texMadeira = (claro, escuro) => tex(256, 256, (g, w, h) => {
  g.fillStyle = claro; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 2) { g.fillStyle = escuro; g.globalAlpha = 0.08 + 0.25 * Math.abs(Math.sin(y * 0.11 + Math.sin(y * 0.031) * 3)); g.fillRect(0, y, w, 2); }
  g.globalAlpha = 1;
});

// ---------------- Materiais (cores institucionais) ----------------
const std = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.6, metalness: 0 }, o));
const M = {
  piso: std(0xffffff, { map: texPiso, roughness: 0.45 }),
  parede: std(0xF2F1EC, { roughness: 0.92 }),
  barrado: std(0xA9B4BC, { roughness: 0.9 }),
  parede_ext: std(0xC3C7C8, { roughness: 0.85 }),
  forro: std(0xFAFAF8, { roughness: 0.95 }),
  calcada: std(0xA7A39B, { roughness: 0.95 }),
  tatil: std(0xE3B21B, { roughness: 0.8 }),
  asfalto: std(0x3A3B3C, { roughness: 0.95 }),
  vidro: new THREE.MeshPhysicalMaterial({ color: 0xDDEFF3, roughness: 0.05, metalness: 0, transparent: true, opacity: 0.18, depthWrite: false, side: THREE.DoubleSide }),
  jateado: new THREE.MeshStandardMaterial({ color: 0xF4F8FA, roughness: 0.5, transparent: true, opacity: 0.62, depthWrite: false, side: THREE.DoubleSide }),
  fume: std(0x141618, { roughness: 0.1 }),
  madeira: std(0xffffff, { map: texMadeira("#C9A06C", "#8E643A"), roughness: 0.5 }),
  madeira_esc: std(0xffffff, { map: texMadeira("#6B4029", "#3A2012"), roughness: 0.45 }),
  marmore: std(0xffffff, { map: texMarmore, roughness: 0.2 }),
  aluminio: std(0xC9CCCF, { roughness: 0.3, metalness: 0.8 }),
  aco: std(0xF0F0EE, { roughness: 0.35, metalness: 0.2 }),
  laca: std(0xF5F5F3, { roughness: 0.3 }),
  preto: std(0x1A1A1A, { roughness: 0.6 }),
  louca: std(0xFFFFFF, { roughness: 0.15 }),
  azul: std(0x0B3F86), ciano: std(0x22A8E6), turquesa: std(0x16BFB0), verde: std(0x8CC63F),
  grafite: std(0x1F2B28, { roughness: 0.5 }),
  est_azul: std(0x16376B, { roughness: 0.85 }), est_turq: std(0x2A9D93, { roughness: 0.85 }),
  est_verde: std(0x7DB33A, { roughness: 0.9 }), maca: std(0x1D5F86, { roughness: 0.5 }),
  led: new THREE.MeshBasicMaterial({ color: 0xFFF6E8 }),
  tela: new THREE.MeshBasicMaterial({ color: 0x1B5FA8 }),
  folha: std(0x3E7D3A, { roughness: 0.7 }), vaso: std(0xE9E4DA),
};

// ---------------- Primitivas ----------------
function B(c, s, m, pai = cena) {           // caixa por centro/tamanho (coord. Blender locais)
  const me = new THREE.Mesh(new THREE.BoxGeometry(s[0], s[2], s[1]), m);
  me.position.copy(V(c[0], c[1], c[2])); pai.add(me); return me;
}
function BX(mn, mx, m, pai = cena, solido = false) {
  if (solido) solidos.push([mn[0], mn[1], mx[0], mx[1]]);
  return B([(mn[0] + mx[0]) / 2, (mn[1] + mx[1]) / 2, (mn[2] + mx[2]) / 2],
           [mx[0] - mn[0], mx[1] - mn[1], mx[2] - mn[2]], m, pai);
}
function CY(c, r, h, m, pai = cena, eixo = "Z") {
  const me = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 24), m);
  if (eixo === "X") me.rotation.z = Math.PI / 2;
  if (eixo === "Y") me.rotation.x = Math.PI / 2;
  me.position.copy(V(c[0], c[1], c[2])); pai.add(me); return me;
}
function SP(c, r, m, pai = cena) {
  const me = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 12), m);
  me.position.copy(V(c[0], c[1], c[2])); pai.add(me); return me;
}
const OLHA = { "+Y": 0, "-Y": Math.PI, "+X": -Math.PI / 2, "-X": Math.PI / 2 };
function grupo(x, y, rot = 0, z = 0) {
  const g = new THREE.Group(); g.position.copy(V(x, y, z)); g.rotation.y = rot; cena.add(g); return g;
}
function solido(obj, folga = 0) {           // registra a projeção do objeto no piso
  obj.updateMatrixWorld(true);
  const bb = new THREE.Box3().setFromObject(obj);
  solidos.push([bb.min.x - folga, -bb.max.z - folga, bb.max.x + folga, -bb.min.z + folga]);
}
function viga(p0, p1, larg, alt, m) {
  const a = V(...p0), b = V(...p1), d = b.clone().sub(a);
  const me = new THREE.Mesh(new THREE.BoxGeometry(d.length(), alt, larg), m);
  me.position.copy(a).add(b).multiplyScalar(0.5);
  me.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), d.normalize());
  cena.add(me); return me;
}
// Parede com vãos; divide em barrado (até 1.10) + pintura clara
function parede(eixo, ini, fim, pos, esp, alt, aberturas = [], comBarrado = true) {
  const trechos = []; let cur = ini;
  aberturas.sort((p, q) => p[0] - q[0]).forEach(([a0, a1, h]) => {
    if (a0 > cur) trechos.push([cur, a0, 0, alt]);
    if (h < alt) trechos.push([a0, a1, h, alt]);
    cur = a1;
  });
  if (cur < fim) trechos.push([cur, fim, 0, alt]);
  for (const [s0, s1, z0, z1] of trechos) {
    const faixa = (za, zb, m) => {
      if (zb <= za) return;
      if (eixo === "X") BX([s0, pos - esp / 2, za], [s1, pos + esp / 2, zb], m);
      else BX([pos - esp / 2, s0, za], [pos + esp / 2, s1, zb], m);
    };
    if (comBarrado) { faixa(z0, Math.min(z1, BARRADO), M.barrado); faixa(Math.max(z0, BARRADO), z1, M.parede); }
    else faixa(z0, z1, M.parede_ext);
    if (z0 === 0) solidos.push(eixo === "X" ? [s0, pos - esp / 2, s1, pos + esp / 2] : [pos - esp / 2, s0, pos + esp / 2, s1]);
  }
}
// Texto em placa (canvas). partes = [[texto, cor], ...]
function placa(partes, larg, alt, c, rot, fundo = null, peso = 700) {
  const cv = document.createElement("canvas"); cv.width = 1024; cv.height = Math.round(1024 * alt / larg);
  const g = cv.getContext("2d");
  if (fundo) { g.fillStyle = fundo; g.fillRect(0, 0, cv.width, cv.height); }
  let fs = cv.height * 0.72; g.font = `${peso} ${fs}px Lexend, sans-serif`;
  const total = () => partes.reduce((s, p) => s + g.measureText(p[0]).width, 0);
  while (total() > cv.width * 0.96) { fs *= 0.95; g.font = `${peso} ${fs}px Lexend, sans-serif`; }
  let x = (cv.width - total()) / 2; g.textBaseline = "middle";
  for (const [t, cor] of partes) { g.fillStyle = cor; g.fillText(t, x, cv.height / 2); x += g.measureText(t).width; }
  const t = new THREE.CanvasTexture(cv); t.anisotropy = 4;
  const me = new THREE.Mesh(new THREE.PlaneGeometry(larg, alt), new THREE.MeshBasicMaterial({ map: t, transparent: !fundo }));
  me.position.copy(V(...c)); me.rotation.y = rot; cena.add(me); return me;
}
// Símbolo da marca simplificado: 4 pétalas + 3 pessoas
function logo(c, esc, normal) {
  const d = 0.09 * esc, r = 0.075 * esc, eixo = normal === "X" ? "X" : "Y";
  const pos = (h, v) => normal === "X" ? [c[0], c[1] + h, c[2] + v] : [c[0] + h, c[1], c[2] + v];
  [[0, 1, M.turquesa], [1, 0, M.ciano], [0, -1, M.azul], [-1, 0, M.verde]]
    .forEach(([h, v, m]) => CY(pos(h * d, v * d), r, 0.02, m, cena, eixo));
  [-1.2, 0, 1.2].forEach(h => CY(pos(h * d, -2 * d - (h === 0 ? 0.3 * d : 0)), 0.028 * esc, 0.02, M.azul, cena, eixo));
}

// ======================================================================
// 1. PAREDES E DIVISÓRIAS
// ======================================================================
parede("Y", -0.25, PROF + 0.10, -EE / 2, EE, LAJE);
parede("Y", -0.25, PROF + 0.10, LARG + EE / 2, EE, LAJE);
parede("X", 0, SX0 - EI, PROF + EI / 2, EI, PE);
parede("X", SX1 + EI, LARG, PROF + EI / 2, EI, PE, [[6.75, 7.65, 2.10]]);
BX([6.75, PROF + 0.02, 0], [7.65, PROF + 0.08, 2.10], M.fume, cena, true);       // porta garagem
parede("Y", SY0, SY1 + EI, SX0 - EI / 2, EI, PE);
parede("Y", SY0, SY1 + EI, SX1 + EI / 2, EI, PE);
parede("X", SX0 - EI, SX1 + EI, SY1 + EI / 2, EI, PE);
parede("Y", SY0 + 0.02, SY1, (DX0 + DX1) / 2, DX1 - DX0, PE);                    // drywall acústico
parede("X", LX0, LARG, LY0 + EI / 2, EI, PE);                                     // lavabo
parede("X", LX0, LARG, LY1 - EI / 2, EI, PE);
parede("Y", LY0 + EI, LY1 - EI, LX0 + EI / 2, EI, PE, [[5.15, 5.85, 2.10]]);
BX([LX0 + EI + 0.01, 5.13, 0], [LX0 + EI + 0.71, 5.17, 2.10], M.madeira);

// ======================================================================
// 2. VIDROS DOS CONSULTÓRIOS (bandeira incolor + jateado para privacidade)
// ======================================================================
{
  const y = SY0, al = M.aluminio;
  BX([SX0, y - 0.03, 2.30], [SX1, y + 0.03, 2.35], al);
  BX([SX0, y - 0.03, PE - 0.03], [SX1, y + 0.03, PE], al);
  BX([2.45, y - 0.03, 0], [2.49, y + 0.03, 2.30], al, cena, true);
  BX([DX0, y - 0.03, 0], [DX1, y + 0.03, PE], al, cena, true);
  BX([4.81, y - 0.03, 0], [4.85, y + 0.03, 2.30], al, cena, true);
  BX([SX1 - 0.04, y - 0.03, 0], [SX1, y + 0.03, 2.30], al);
  BX([SX0, y - 0.01, 2.35], [SX1, y + 0.01, PE - 0.03], M.vidro);
  BX([2.49, y - 0.01, 0.04], [DX0, y + 0.01, 2.30], M.jateado, cena, true);
  BX([4.85, y - 0.01, 0.04], [SX1 - 0.04, y + 0.01, 2.30], M.jateado, cena, true);
  [[SX0 + 0.04, 1.10], [DX1 + 0.04, 0.90]].forEach(([x0, l]) => {      // portas abertas 90°
    BX([x0, y + 0.03, 0.01], [x0 + 0.04, y + 0.03 + l, 2.29], M.jateado, cena, true);
    BX([x0 + 0.04, y + l - 0.10, 0.85], [x0 + 0.07, y + l - 0.07, 1.25], al);
  });
  placa([["CONSULTÓRIO 01", "#0B3F86"]], 1.6, 0.2, [(SX0 + DX0) / 2, y - 0.03, 2.58], 0);
  placa([["CONSULTÓRIO 02", "#0B3F86"]], 1.6, 0.2, [(DX1 + SX1) / 2, y - 0.03, 2.58], 0);
}

// ======================================================================
// 3. PISO, CALÇADA E FORRO (com vão da escada)
// ======================================================================
BX([-EE, -0.25, -0.05], [LARG + EE, SY1 + EI, 0], M.piso);
BX([-3, -4, -0.12], [LARG + 3, -0.25, 0], M.calcada);
BX([-3, -1.60, 0], [LARG + 3, -1.35, 0.004], M.tatil);
BX([-3, -12, -0.30], [LARG + 3, -4, -0.15], M.asfalto);
const FY0 = 4.10, FY1 = PY1 + 0.07;
[[[0, 0, PE], [LARG, FY0, LAJE]], [[L2X1, FY0, PE], [LARG, FY1, LAJE]],
 [[0, FY1, PE], [LARG, PROF, LAJE]], [[SX0, SY0, PE], [SX1, SY1, LAJE]]]
  .forEach(([a, b]) => BX(a, b, M.forro, forro));

// ======================================================================
// 4. FACHADA (vitrine, porta dupla aberta e letreiro em ACM)
// ======================================================================
BX([-EE, -0.25, 0], [0.30, 0, LAJE], M.parede_ext, cena, true);
BX([LARG - 0.30, -0.25, 0], [LARG + EE, 0, LAJE], M.parede_ext, cena, true);
BX([0.30, -0.20, 2.90], [LARG - 0.30, 0, LAJE], M.parede);
BX([-EE, -0.25, LAJE], [LARG + EE, 0, 4.80], M.parede_ext);
BX([-EE, -0.32, 2.95], [LARG + EE, -0.25, 4.75], M.grafite);
BX([1.0, -0.335, 3.24], [LARG - 0.2, -0.32, 3.27], M.verde);
placa([["Descont'", "#FFFFFF"], ["Saúde", "#8CC63F"]], 5.6, 0.9, [4.45, -0.34, 4.00], 0);
placa([["CONSULTAS  ·  EXAMES  ·  ODONTOLOGIA", "#FFFFFF"]], 5.2, 0.24, [4.45, -0.34, 3.45], 0, null, 600);
logo([0.75, -0.345, 3.95], 2.6, "Y");
{

  canvas.setPointerCapture(e.pointerId); canvas.focus();
  const toque = e.pointerType !== "mouse";
  if (toque) document.body.classList.add("toque");
  const papel = toque && e.clientX < innerWidth / 2 && !est.planta ? "andar" : "olhar";
  toques.set(e.pointerId, { papel, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY });
  if (papel === "andar") { joy.hidden = false; joy.style.left = e.clientX + "px"; joy.style.top = e.clientY + "px"; }
});
canvas.addEventListener("pointermove", e => {
  const t = toques.get(e.pointerId); if (!t) return;
  if (t.papel === "olhar") {

    if (est.planta) { const k2 = zoomPlanta / canvas.clientHeight; est.px -= (e.clientX - t.x) * k2; est.py += (e.clientY - t.y) * k2; }
    else { est.yaw -= (e.clientX - t.x) * k; est.pitch = Math.max(-1.3, Math.min(1.3, est.pitch - (e.clientY - t.y) * k)); }
  } else {
    let dx = e.clientX - t.x0, dy = e.clientY - t.y0; const d = Math.hypot(dx, dy), max = 50;
    if (d > max) { dx *= max / d; dy *= max / d; }
    joyVec = [dx / max, dy / max]; joyPino.style.transform = `translate(${dx}px, ${dy}px)`;
  }

let zoomPlanta = 14;
function redimensionar() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  render.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix();
  const a = w / h, z = zoomPlanta;
  if (a > 1) Object.assign(camPlanta, { left: -z * a / 2, right: z * a / 2, top: z / 2, bottom: -z / 2 });
  else Object.assign(camPlanta, { left: -z / 2, right: z / 2, top: z / a / 2, bottom: -z / a / 2 });
  camPlanta.updateProjectionMatrix();
}

  if (y > SY0 && x > DX1 && x < SX1) return ["Consultório 02", "≈ 10,0 m² · maca, mesa e lavatório"];
  if (x > LX0 && y > LY0 && y < LY1) return ["Lavabo", "existente"];
  if (x > 5.6 && y < 4.0) return ["Recepção", "balcão com trecho acessível h = 0,80 m"];
  if (x > 4.3 && y >= 3.8 && y < 7.2) return ["Atendimento de vendas", "2 estações"];
  if (x < 3.0 && y < 5.3) return ["Espera", "8 lugares + bebedouro"];
  return ["Hall / circulação", "58,18 m²"];
}
let zonaAtual = "";

// Laço principal
let t0 = performance.now();
function quadro(t) {
  const dt = Math.min(0.05, (t - t0) / 1000); t0 = t;
  if (!est.planta) {
    let f = 0, s = 0, giro = 0;
    if (teclas.has("KeyW") || teclas.has("ArrowUp")) f += 1;
    if (teclas.has("KeyS") || teclas.has("ArrowDown")) f -= 1;
    if (teclas.has("KeyA")) s -= 1;
    if (teclas.has("KeyD")) s += 1;
    if (teclas.has("ArrowLeft")) giro += 1;
    if (teclas.has("ArrowRight")) giro -= 1;
    est.yaw += giro * 1.6 * dt;
    f -= joyVec[1]; s += joyVec[0];
    const vel = (teclas.has("ShiftLeft") || teclas.has("ShiftRight") ? 3.2 : 1.4) * dt;
    const fx = -Math.sin(est.yaw), fy = Math.cos(est.yaw), rx = Math.cos(est.yaw), ry = Math.sin(est.yaw);
    const n = Math.hypot(f, s); if (n > 1) { f /= n; s /= n; }
    mover((fx * f + rx * s) * vel, (fy * f + ry * s) * vel);
    cam.position.copy(V(est.x, est.y, OLHO));
    cam.rotation.set(est.pitch, est.yaw, 0);
    render.render(cena, cam);
  } else {
    camPlanta.position.copy(V(est.px, est.py, 30)); camPlanta.up.set(0, 0, -1); camPlanta.lookAt(V(est.px, est.py, 0));
    render.render(cena, camPlanta);
  }
  const [nome, info] = est.planta ? ["Planta", "arraste para mover · role para zoom"] : zona(est.x, est.y);
  if (nome + info !== zonaAtual) { zonaAtual = nome + info; zonaEl.innerHTML = `<strong>${nome}</strong> · ${info}`; }
  requestAnimationFrame(quadro);
}
redimensionar();
document.getElementById("carregando").hidden = true;
if (matchMedia("(pointer: coarse)").matches) document.body.classList.add("toque");
if (innerWidth < 520) { ajuda.hidden = true; btnAjuda.setAttribute("aria-pressed", "false"); }
requestAnimationFrame(quadro);
})();
</script>
